@if (project) {
  <div class="mt-6 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h3 class="text-xl font-bold text-gray-900">{{ project.name }}</h3>
        <p class="mt-1 text-sm text-gray-600">{{ project.description }}</p>
        <p class="mt-2 text-sm text-gray-700">
          Statut: <span class="font-semibold">{{ project.status }}</span>
        </p>
      </div>

    </div>

    <!-- Progress -->
    <div class="mt-4">
      <div class="flex items-center justify-between text-xs text-gray-600">
        <span>Progression</span>
        <span class="font-semibold text-gray-800">{{ getProgress() }}%</span>
      </div>
      <div class="mt-1 h-2 w-full rounded-full bg-gray-100">
        <div
          class="h-2 rounded-full bg-blue-500 transition-all duration-500"
          [style.width.%]="getProgress()"
        ></div>
      </div>
    </div>

    <!-- Add task -->
    <div class="mt-5 rounded-lg border border-gray-200 bg-gray-50 p-3">
      <p class="text-sm font-semibold text-gray-800">Ajouter une tâche</p>

      <div class="mt-2 grid grid-cols-1 gap-2 md:grid-cols-3">
        <input
          class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm outline-none focus:border-gray-300"
          placeholder="Titre de la tâche"
          [(ngModel)]="project.newTaskTitle"
          (keydown.enter)="addTask()"
        />

        <select
          class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm outline-none focus:border-gray-300"
          [(ngModel)]="project.newTaskPriority"
        >
          @for (p of priorities; track p) { <option [value]="p">{{ p }}</option> }
        </select>

        <select
          class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm outline-none focus:border-gray-300"
          [(ngModel)]="project.newTaskStatus"
        >
          @for (s of statuses; track s) { <option [value]="s">{{ s }}</option> }
        </select>
      </div>

      <div class="mt-2 flex justify-end">
        <button
          type="button"
          (click)="addTask()"
          class="rounded-lg bg-gray-900 px-3 py-2 text-sm font-semibold text-white hover:opacity-90"
        >
          Ajouter
        </button>
      </div>
    </div>

    <!-- Tasks -->
    <div class="mt-5">

      @if (project.tasks.length === 0) {

        <div class="rounded-lg border border-dashed border-gray-300 bg-gray-50 p-6 text-center">
          <p class="text-sm font-semibold text-gray-600">
            Aucune tâche
          </p>
        </div>

      } @else {

        <app-task-list [tasks]="project.tasks"></app-task-list>

      }

    </div>
  </div>
}
