@if (project) {
  <div class="mt-6 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-5 shadow-sm">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h3 class="text-xl font-bold text-gray-900 dark:text-white">{{ project.name }}</h3>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">{{ project.description }}</p>
        <div class="mt-2 flex flex-wrap items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
          <span>Statut:</span>
          <app-status-badge [status]="project.status"></app-status-badge>
        </div>
        <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
          Créé {{ project.createdAt | friendlyDate }}
        </p>
      </div>
    </div>

    <div
      id="task-message"
      style="display:none; opacity:1; transition: opacity 0.5s ease;"
      class="mt-4 items-center justify-between rounded-lg bg-green-50 dark:bg-green-900 border border-green-200 dark:border-green-700 px-4 py-3"
    >
      <p class="text-sm font-medium text-green-800 dark:text-green-200">{{ message }}</p>
      <button
        type="button"
        (click)="closeMessage()"
        class="ml-4 text-green-600 dark:text-green-300 hover:text-green-900 dark:hover:text-white font-bold text-lg leading-none"
      >
        ×
      </button>
    </div>

    <div class="mt-4">
      <div class="flex items-center justify-between text-xs text-gray-600 dark:text-gray-400">
        <span>Progression</span>
        <span class="font-semibold text-gray-800 dark:text-gray-200">{{ getProgress() }}%</span>
      </div>
      <div class="mt-1 h-2 w-full rounded-full bg-gray-100 dark:bg-gray-700">
        <div
          class="h-2 rounded-full bg-blue-500 dark:bg-blue-400 transition-all duration-500"
          [style.width.%]="getProgress()"
        ></div>
      </div>
    </div>

    <div class="mt-5 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-3">
      <p class="text-sm font-semibold text-gray-800 dark:text-gray-200">Ajouter une tâche</p>

      <div class="mt-2 grid grid-cols-1 gap-2 md:grid-cols-3">
        <input
          class="rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2 text-sm outline-none focus:border-gray-300 dark:focus:border-gray-500"
          placeholder="Titre de la tâche"
          [(ngModel)]="project.newTaskTitle"
          (keydown.enter)="addTask()"
        />
        <select
          class="rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2 text-sm outline-none"
          [(ngModel)]="project.newTaskPriority"
        >
          @for (priority of priorities; track priority) {
            <option [value]="priority">{{ priority }}</option>
          }
        </select>
        <select
          class="rounded-lg border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2 text-sm outline-none"
          [(ngModel)]="project.newTaskStatus"
        >
          @for (status of statuses; track status) {
            <option [value]="status">{{ status }}</option>
          }
        </select>
      </div>

      <div class="mt-2 flex justify-end">
        <button
          type="button"
          (click)="addTask()"
          class="rounded-lg bg-gray-900 dark:bg-white px-3 py-2 text-sm font-semibold text-white dark:text-gray-900 hover:opacity-90"
        >
          Ajouter
        </button>
      </div>
    </div>

    <div class="mt-5">
      @if (project.tasks.length === 0) {
        <div class="rounded-lg border border-dashed border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 p-6 text-center">
          <p class="text-sm font-semibold text-gray-600 dark:text-gray-400">Aucune tâche</p>
        </div>
      } @else {
        <app-task-list
          [tasks]="project.tasks"
          (statusChanged)="onStatusChanged($event)"
        ></app-task-list>
      }
    </div>
  </div>
}
