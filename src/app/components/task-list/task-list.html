<div class="space-y-4 mt-4">
  @for (task of tasks; track task.title) {

    <div
      class="group flex items-start justify-between gap-6 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-300 hover:shadow-lg hover:-translate-y-1"
      [appHighlightStatus]="task.status"
    >

      <!-- Left Side -->
      <div class="min-w-0 flex-1 space-y-2">
        <p
          class="truncate text-lg font-semibold transition-colors duration-300"
          [ngClass]="task.priority | priorityColor"
        >
          {{ task.title }}
        </p>

        <div class="flex flex-wrap gap-3 text-xs font-semibold">
          <span
            class="rounded-full px-3 py-1"
            [ngClass]="{
              'bg-red-100 text-red-700': task.priority === 'Haute',
              'bg-yellow-100 text-yellow-700': task.priority === 'Moyenne',
              'bg-gray-100 text-gray-700': task.priority === 'Basse'
            }"
          >
            Priorité: {{ task.priority }}
          </span>

          <span
            class="rounded-full px-3 py-1"
            [ngClass]="{
              'bg-yellow-100 text-yellow-700': task.status === 'En attente',
              'bg-blue-100 text-blue-700': task.status === 'En cours',
              'bg-green-100 text-green-700': task.status === 'Terminé'
            }"
          >
            {{ task.status }}
          </span>
        </div>
      </div>

      <!-- Right Side -->
      <div class="flex flex-col items-end gap-3">
        <select
          class="rounded-lg border border-gray-300 bg-white px-3 py-1 text-sm outline-none transition focus:border-blue-400"
          [(ngModel)]="task.status"
        >
          @for (s of statuses; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>

        <div
          class="h-3 w-3 rounded-full transition-all duration-300"
          [ngClass]="{
            'bg-yellow-500': task.status === 'En attente',
            'bg-blue-500': task.status === 'En cours',
            'bg-green-500': task.status === 'Terminé'
          }"
        ></div>
      </div>

    </div>

  }
</div>
