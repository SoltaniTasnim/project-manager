<div class="space-y-4 mt-4">
  <div class="flex flex-col gap-3 rounded-2xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-4 md:flex-row md:items-center md:justify-between">
    <div>
      <p class="text-sm font-semibold text-gray-900 dark:text-white">Filtrer les tâches par priorité</p>
      <p
        class="mt-1 text-xs font-semibold"
        [ngClass]="selectedPriority === 'Toutes' ? 'text-gray-500 dark:text-gray-400' : (selectedPriority | priorityColor)"
      >
        Filtre actif : {{ selectedPriority }}
      </p>
    </div>

    <select
      class="rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-2 text-sm font-medium text-gray-900 dark:text-white outline-none focus:border-blue-400"
      [(ngModel)]="selectedPriority"
    >
      @for (priority of priorities; track priority) {
        <option [value]="priority">{{ priority }}</option>
      }
    </select>
  </div>

  @if (filteredTasks.length === 0) {
    <div class="rounded-2xl border border-dashed border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 p-6 text-center">
      <p class="text-sm font-semibold text-gray-600 dark:text-gray-400">
        Aucune tâche pour cette priorité
      </p>
    </div>
  }

  @for (task of filteredTasks; track task.title) {
    <div
      class="group flex items-start justify-between gap-6 rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-5 shadow-sm"
      [class.animate-task-in]="task.isNew"
      [appHighlightStatus]="task.status"
    >
      <div class="min-w-0 flex-1 space-y-2">
        <p
          class="truncate text-lg font-semibold transition-colors duration-300"
          [ngClass]="task.priority | priorityColor"
        >
          {{ task.title }}
        </p>

        <div class="flex flex-wrap gap-3 text-xs font-semibold">
          <span
            class="rounded-full px-3 py-1"
            [ngClass]="{
              'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300': task.priority === 'Haute',
              'bg-yellow-100 text-yellow-700 dark:bg-yellow-900 dark:text-yellow-300': task.priority === 'Moyenne',
              'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300': task.priority === 'Basse'
            }"
          >
            Priorité: {{ task.priority }}
          </span>

          <app-status-badge
            [status]="task.status"
            [prefix]="task.status | statusEmoji"
          ></app-status-badge>
        </div>
      </div>

      <div class="flex flex-col items-end gap-3">
        <select
          class="rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-1 text-sm outline-none transition focus:border-blue-400"
          [(ngModel)]="task.status"
          (ngModelChange)="markStatusChanged(task)"
        >
          @for (status of statuses; track status) {
            <option [value]="status">{{ status }}</option>
          }
        </select>

        <button
          type="button"
          (click)="changeStatus(task)"
          class="rounded-lg bg-blue-600 dark:bg-blue-500 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors"
        >
          Changer statut
        </button>

        <div
          class="h-3 w-3 rounded-full transition-all duration-300"
          [ngClass]="{
            'bg-yellow-500': task.status === 'En attente',
            'bg-blue-500': task.status === 'En cours',
            'bg-green-500': task.status === 'Terminé'
          }"
        ></div>
      </div>
    </div>
  }
</div>
