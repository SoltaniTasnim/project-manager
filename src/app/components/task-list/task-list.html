@if (tasks.length === 0) {
  <!-- Animated empty state -->
  <div class="rounded-xl border border-dashed border-gray-300 bg-white p-6 text-center">
    <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 animate-bounce">
      <svg viewBox="0 0 20 20" class="h-6 w-6 text-gray-700" aria-hidden="true">
        <path
          fill="currentColor"
          d="M10 2a6 6 0 0 0-6 6v1.2c0 .5-.2 1-.6 1.3L2.6 11a1 1 0 0 0 .6 1.8H6v1a4 4 0 0 0 8 0v-1h2.8a1 1 0 0 0 .6-1.8l-.8-.5c-.4-.3-.6-.8-.6-1.3V8a6 6 0 0 0-6-6zm2 12a2 2 0 0 1-4 0v-1h4v1z"
        />
      </svg>
    </div>
    <p class="font-semibold text-gray-900">Aucune tâche à afficher</p>
    <p class="text-sm text-gray-600">Ajoute une tâche ou change les filtres.</p>
  </div>
} @else {
  <div class="space-y-3">
    @for (task of tasks; track task.title) {
      <div
        class="flex items-start justify-between gap-4 rounded-xl border bg-white p-3 shadow-sm transition hover:shadow"
        [class.border-yellow-200]="task.status === 'En attente'"
        [class.border-blue-200]="task.status === 'En cours'"
        [class.border-green-200]="task.status === 'Terminé'"
      >
        <div class="min-w-0 flex-1">
          <p class="truncate font-semibold text-gray-900">{{ task.title }}</p>

          <div class="mt-2 flex flex-wrap gap-2 text-xs font-semibold">
            <span
              class="rounded-full px-2 py-0.5"
              [class.bg-red-100]="task.priority === 'Haute'"
              [class.text-red-700]="task.priority === 'Haute'"
              [class.bg-yellow-100]="task.priority === 'Moyenne'"
              [class.text-yellow-700]="task.priority === 'Moyenne'"
              [class.bg-gray-100]="task.priority === 'Basse'"
              [class.text-gray-700]="task.priority === 'Basse'"
            >
              Priorité: {{ task.priority }}
            </span>

            <span
              class="rounded-full px-2 py-0.5"
              [class.bg-yellow-100]="task.status === 'En attente'"
              [class.text-yellow-700]="task.status === 'En attente'"
              [class.bg-blue-100]="task.status === 'En cours'"
              [class.text-blue-700]="task.status === 'En cours'"
              [class.bg-green-100]="task.status === 'Terminé'"
              [class.text-green-700]="task.status === 'Terminé'"
            >
              Statut: {{ task.status }}
            </span>
          </div>
        </div>

        <!-- Status dropdown (editable) -->
        <div class="flex flex-col items-end gap-2">
          <select
            class="rounded-lg border border-gray-200 bg-white px-2 py-1 text-xs outline-none focus:border-gray-300"
            [(ngModel)]="task.status"
          >
            @for (s of statuses; track s) {
              <option [value]="s">{{ s }}</option>
            }
          </select>

          <!-- tiny status dot -->
          <span
            class="h-3 w-3 rounded-full"
            [class.bg-yellow-500]="task.status === 'En attente'"
            [class.bg-blue-500]="task.status === 'En cours'"
            [class.bg-green-500]="task.status === 'Terminé'"
            aria-hidden="true"
          ></span>
        </div>
      </div>
    }
  </div>
}
