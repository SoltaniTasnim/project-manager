<div class="mt-4 space-y-2">
  @for (task of tasks; track task.title) {
    <div
      class="border-l-4 p-2"
      [class.border-yellow-500]="task.status === 'En attente'"
      [class.border-blue-500]="task.status === 'En cours'"
      [class.border-green-500]="task.status === 'Terminé'"
    >
      <p class="font-semibold">{{ task.title }}</p>
      <p class="text-sm">Priorité : {{ task.priority }}</p>
      <p class="text-sm">Statut : {{ task.status }}</p>
    </div>
  }
</div>
