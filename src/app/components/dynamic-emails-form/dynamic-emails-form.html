<section class="rounded-3xl border border-sky-100 dark:border-sky-900/60 bg-white dark:bg-gray-800 p-6 shadow-sm">
  <div class="flex items-center justify-between gap-4">
    <div>
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-sky-700 dark:text-sky-300">
        TP5 - Partie 4.1
      </p>
      <h3 class="mt-2 text-2xl font-bold text-gray-900 dark:text-white">
        FormArray d'emails dynamiques
      </h3>
    </div>

    <button
      type="button"
      (click)="addEmail()"
      class="rounded-2xl bg-sky-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-sky-700"
    >
      Ajouter un email
    </button>
  </div>

  <form class="mt-6 space-y-4" [formGroup]="emailForm">
    <div formArrayName="emails" class="space-y-4">
      @for (emailGroup of emails.controls; track $index; let i = $index) {
        <div [formGroupName]="i" class="grid grid-cols-1 gap-4 rounded-2xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-4 lg:grid-cols-[2fr_1fr_auto]">
          <div class="space-y-2">
            <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Email {{ i + 1 }}</label>
            <input
              type="email"
              formControlName="email"
              class="w-full rounded-2xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition focus:border-sky-400"
              placeholder="user@example.com"
            />
          </div>

          <div class="space-y-2">
            <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Type</label>
            <select
              formControlName="type"
              class="w-full rounded-2xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition focus:border-sky-400"
            >
              <option value="personnel">Personnel</option>
              <option value="pro">Professionnel</option>
              <option value="autre">Autre</option>
            </select>
          </div>

          <div class="flex items-end">
            <button
              type="button"
              (click)="removeEmail(i)"
              [disabled]="emails.length === 1"
              class="w-full rounded-2xl border border-red-200 dark:border-red-900 px-4 py-3 text-sm font-semibold text-red-700 dark:text-red-300 transition hover:bg-red-50 dark:hover:bg-red-950/30 disabled:cursor-not-allowed disabled:opacity-50"
            >
              Supprimer
            </button>
          </div>
        </div>
      }
    </div>
  </form>

  <div class="mt-6 rounded-2xl bg-gray-50 dark:bg-gray-900 p-4">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400">
      Valeur du FormArray
    </p>
    <pre class="mt-3 overflow-x-auto text-sm text-gray-800 dark:text-gray-200">{{ emailForm.value | json }}</pre>
  </div>
</section>
