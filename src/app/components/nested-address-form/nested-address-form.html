<section class="rounded-3xl border border-rose-100 dark:border-rose-900/60 bg-white dark:bg-gray-800 p-6 shadow-sm">
  <p class="text-sm font-semibold uppercase tracking-[0.2em] text-rose-700 dark:text-rose-300">
    TP5 - Partie 5.1
  </p>
  <h3 class="mt-2 text-2xl font-bold text-gray-900 dark:text-white">
    Formulaire avec adresse imbriquee
  </h3>

  <form class="mt-6 grid grid-cols-1 gap-4 xl:grid-cols-2" [formGroup]="profileForm">
    <input formControlName="nom" class="rounded-2xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition focus:border-rose-400" placeholder="Nom" />
    <input formControlName="prenom" class="rounded-2xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition focus:border-rose-400" placeholder="Prenom" />
    <input formControlName="email" class="rounded-2xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition focus:border-rose-400 xl:col-span-2" placeholder="Email" />

    <div formGroupName="adresse" class="grid grid-cols-1 gap-4 rounded-2xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-4 xl:col-span-2 md:grid-cols-2">
      <input formControlName="rue" class="rounded-2xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition focus:border-rose-400 md:col-span-2" placeholder="Rue" />
      <input formControlName="codePostal" class="rounded-2xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition focus:border-rose-400" placeholder="Code postal" />
      <input formControlName="ville" class="rounded-2xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition focus:border-rose-400" placeholder="Ville" />
      <input formControlName="pays" class="rounded-2xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-3 text-sm text-gray-900 dark:text-white outline-none transition focus:border-rose-400 md:col-span-2" placeholder="Pays" />
    </div>
  </form>

  <div class="mt-6 rounded-2xl bg-gray-50 dark:bg-gray-900 p-4">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400">
      Valeur du formulaire
    </p>
    <pre class="mt-3 overflow-x-auto text-sm text-gray-800 dark:text-gray-200">{{ profileForm.value | json }}</pre>
  </div>
</section>
