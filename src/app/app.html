<div class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
  <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
    <h1 class="text-xl font-bold text-gray-900 dark:text-white">
      Project Manager
    </h1>

    <button
      (click)="toggleTheme()"
      class="rounded-lg px-4 py-2 text-sm font-semibold border transition-colors
             border-gray-200 bg-white text-gray-800 hover:bg-gray-100
             dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600"
    >
      {{ isDark ? '☀️ Mode clair' : '🌙 Mode sombre' }}
    </button>
  </div>

  <div class="p-6">
    <app-project-list></app-project-list>
    <router-outlet />
  </div>
</div>
